[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codna"
version = "0.1.0"
description = "CodeDNA - Intelligent Software Archaeology Platform"
requires-python = ">=3.9"
dependencies = [
    "GitPython>=3.1.0",
    "pathspec>=0.11.0",
]

[project.scripts]
codna = "codna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
