[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codna"
version = "0.1.0"
description = "CodeDNA - Intelligent Software Archaeology Platform"
requires-python = ">=3.9"
dependencies = [
    "GitPython>=3.1.0",
    "pathspec>=0.11.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.20.0",
    "networkx>=3.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
codna = "codna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
