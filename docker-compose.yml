# Docker Compose for CodeDNA

services:
  codna-backend:
    build: .
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - CODNA_DATA_DIR=/codna-data
    volumes:
      - .:/app
      - codna-data:/codna-data

  codna-dashboard:
    build:
      context: ./dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    depends_on:
      - codna-backend
    command: npm run dev -- --host

volumes:
  codna-data:
