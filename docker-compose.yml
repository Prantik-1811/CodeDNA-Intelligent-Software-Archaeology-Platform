# Docker Compose for CodeDNA

services:
  codna-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - codna-data:/app/data

  codna-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - codna-backend
    command: npm run dev -- --host

volumes:
  codna-data:
