# Docker Compose for CodeDNA

services:
  codna-backend:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      CODNA_DATA_DIR: /codna-data
      CODNA_DATABASE_URL: ${CODNA_DATABASE_URL:-sqlite:////codna-data/codna.db}
      CODNA_FRONTEND_URL: ${CODNA_FRONTEND_URL:-http://localhost:5173/dashboard/}
      CODNA_COOKIE_SECURE: ${CODNA_COOKIE_SECURE:-false}
      CODNA_AUTH_SECRET: ${CODNA_AUTH_SECRET:-local-only-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8001/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8001/auth/github/callback}
    volumes:
      - codna-data:/codna-data
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  codna-dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      codna-backend:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codna}
      POSTGRES_USER: ${POSTGRES_USER:-codna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codna} -d ${POSTGRES_DB:-codna}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  codna-data:
  postgres-data:
